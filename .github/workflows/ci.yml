name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test:run

      # Compile only: bundle every route and load it, but do not prerender.
      #
      # Prerendering builds the news pages from the site's database, and they
      # fail without it on purpose (a page that renders empty is cached empty:
      # CLAUDE.md, "The loaders throw"). This runner has no database, and is not
      # to be given one: the key the loaders need is the service-role key, and
      # a build here would add its queries to a very small production database
      # and store its results in the cache the live site reads.
      #
      # Vercel runs the full build, with the database, on every pull request
      # and every push. That is the check for prerendering, and for the route
      # table: the one printed here marks every page ƒ and means nothing.
      - name: Build (compile only)
        run: npx next build --experimental-build-mode compile
